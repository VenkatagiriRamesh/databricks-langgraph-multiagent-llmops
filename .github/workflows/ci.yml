name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: |
          if [ -f eval/results/latest_report.json ]; then
            python -m scripts.gate_release --report eval/results/latest_report.json --offline
          fi
