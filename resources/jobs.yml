resources:
  jobs:
    release_pipeline:
      name: insurance_automation_release_pipeline
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - "-e ${workspace.file_path}"
      parameters:
        - name: warehouse_id
          default: ${var.warehouse_id}
        - name: catalog
          default: ${var.catalog}
        - name: fm_model
          default: ${var.fm_model}
      tasks:
        - task_key: bootstrap_data
          environment_key: default
          spark_python_task:
            python_file: ${workspace.file_path}/scripts/job_entry.py
            parameters: ["--warehouse-id", "{{job.parameters.warehouse_id}}", "--catalog", "{{job.parameters.catalog}}", "--fm-model", "{{job.parameters.fm_model}}", "--script", "bootstrap_data"]
        - task_key: train_register_model
          depends_on:
            - task_key: bootstrap_data
          environment_key: default
          spark_python_task:
            python_file: ${workspace.file_path}/scripts/job_entry.py
            parameters: ["--warehouse-id", "{{job.parameters.warehouse_id}}", "--catalog", "{{job.parameters.catalog}}", "--fm-model", "{{job.parameters.fm_model}}", "--script", "train_register_model"]
        - task_key: register_prompts
          depends_on:
            - task_key: train_register_model
          environment_key: default
          spark_python_task:
            python_file: ${workspace.file_path}/scripts/job_entry.py
            parameters: ["--warehouse-id", "{{job.parameters.warehouse_id}}", "--catalog", "{{job.parameters.catalog}}", "--fm-model", "{{job.parameters.fm_model}}", "--script", "register_prompts"]
        - task_key: run_eval
          depends_on:
            - task_key: register_prompts
          environment_key: default
          spark_python_task:
            python_file: ${workspace.file_path}/scripts/job_entry.py
            parameters: ["--warehouse-id", "{{job.parameters.warehouse_id}}", "--catalog", "{{job.parameters.catalog}}", "--fm-model", "{{job.parameters.fm_model}}", "--script", "run_eval", "--", "--split", "heldout", "--runs", "3"]
        - task_key: gate_release
          depends_on:
            - task_key: run_eval
          environment_key: default
          spark_python_task:
            python_file: ${workspace.file_path}/scripts/job_entry.py
            parameters: ["--warehouse-id", "{{job.parameters.warehouse_id}}", "--catalog", "{{job.parameters.catalog}}", "--fm-model", "{{job.parameters.fm_model}}", "--script", "gate_release", "--", "--report", "eval/results/latest_report.json", "--offline"]
        - task_key: deploy_agent_endpoint
          depends_on:
            - task_key: gate_release
          environment_key: default
          spark_python_task:
            python_file: ${workspace.file_path}/scripts/job_entry.py
            parameters: ["--warehouse-id", "{{job.parameters.warehouse_id}}", "--catalog", "{{job.parameters.catalog}}", "--fm-model", "{{job.parameters.fm_model}}", "--script", "deploy_agent_endpoint", "--", "--deploy"]
