[project]
name = "databricks-langgraph-multiagent-llmops"
version = "0.1.0"
description = "LangGraph multi-agent insurance claims and underwriting automation on Databricks Free Edition, with MLflow evaluation and an evaluation-gated release flow."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.40.0",
    "mlflow>=3.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "openai>=1.50.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-mock>=3.14.0", "ruff>=0.5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"
